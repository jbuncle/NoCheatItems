name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read package version and validate release tag
        id: package-version
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version_number
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $baseTag = ($env:GITHUB_REF_NAME -split '\+', 2)[0]
            if ($baseTag -ne "v$version") {
              throw "Release tag $env:GITHUB_REF_NAME does not match package version $version."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download current Valheim dedicated server
        shell: pwsh
        run: |
          $steamCmdPath = Join-Path $env:RUNNER_TEMP 'steamcmd'
          $serverPath = Join-Path $env:RUNNER_TEMP 'valheim'
          New-Item -ItemType Directory -Force -Path $steamCmdPath | Out-Null
          $archivePath = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
          Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $steamCmdPath
          # Finish the fresh SteamCMD install's self-update before requesting app metadata.
          & "$steamCmdPath/steamcmd.exe" +quit
          # The Windows bootstrapper can return 7 after updating itself even when
          # the child process successfully installs the app. Require proof of success.
          $installed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $steamOutput = & "$steamCmdPath/steamcmd.exe" +force_install_dir "$serverPath" +login anonymous +app_update 896660 validate +quit 2>&1
            $steamExitCode = $LASTEXITCODE
            $steamOutput | ForEach-Object { Write-Host $_ }
            $installed = ($steamOutput | Out-String) -match "Success! App '896660' fully installed\."
            if ($installed -and (Test-Path "$serverPath/valheim_server_Data/Managed/assembly_valheim.dll") -and ($steamExitCode -eq 0 -or $steamExitCode -eq 7)) { break }
            $installed = $false
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          if (!$installed) { throw "SteamCMD installation failed after 3 attempts (exit code $steamExitCode)." }
          if (!(Test-Path "$serverPath/valheim_server_Data/Managed/assembly_valheim.dll")) {
            throw 'SteamCMD did not install the required Valheim assemblies.'
          }
          "VALHEIM_BUILD_PATH=$serverPath" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      - name: Build plugin
        shell: pwsh
        run: dotnet build NoCheatItems.csproj -c Release "-p:ValheimPath=$env:VALHEIM_BUILD_PATH"

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item bin/Release/NoCheatItems.dll, README.md, CHANGELOG.md, manifest.json, icon.png -Destination package
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version_number
          Compress-Archive -Path package/* -DestinationPath "NoCheatItems-$version.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NoCheatItems
          path: |
            bin/Release/NoCheatItems.dll
            NoCheatItems-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NoCheatItems
          path: artifacts
      - name: Publish GitHub Release with built files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          dll="artifacts/bin/Release/NoCheatItems.dll"
          zip="artifacts/NoCheatItems-$PACKAGE_VERSION.zip"
          notes=".github/releases/$PACKAGE_VERSION.md"
          test -s "$dll"
          test -s "$zip"
          test -s "$notes"
          # Upload into a draft so the release only becomes public with both assets.
          if existing_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$existing_draft" != 'true' ]; then
              echo 'This release is already published; refusing to replace its files.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$dll" "$zip" --clobber
          else
            gh release create "$RELEASE_TAG" "$dll" "$zip" --verify-tag --draft \
              --title "NoCheatItems $PACKAGE_VERSION — jbuncle fork, Valheim 1.0.17 compatibility patch" \
              --notes-file "$notes"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
